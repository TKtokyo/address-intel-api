name = "address-intel-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Default environment: Base Sepolia (testnet)
[vars]
FACILITATOR_URL = "https://www.x402.org/facilitator"
X402_NETWORK = "eip155:84532"
PUBLIC_ORIGIN = "https://address-intel-api.tatsu77.workers.dev"
# SIWX_SESSION_TTL_SECONDS = "3600"  # optional; default 3600 (matches cache TTL)

# KV namespace for address data cache + SIWx sessions
# (id filled by `wrangler kv namespace create ADDRESS_CACHE`)
[[kv_namespaces]]
binding = "ADDRESS_CACHE"
id = "84fc6b877dbb439d9963f61cb358c48d"

# --- Production environment: Base mainnet ---
[env.production]
name = "address-intel-api"

[env.production.vars]
FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
X402_NETWORK = "eip155:8453"
PUBLIC_ORIGIN = "https://address-intel-api.tatsu77.workers.dev"

[[env.production.kv_namespaces]]
binding = "ADDRESS_CACHE"
id = "84fc6b877dbb439d9963f61cb358c48d"

# Secrets (set via `wrangler secret put`):
# PAY_TO_ADDRESS = "0x..."
# GOPLUS_API_KEY = "..."
#
# Production-only (set via `wrangler secret put --env production`):
# CDP_API_KEY_ID = "..."
# CDP_API_KEY_SECRET = "..."
